# Coolify: "Docker Compose" build pack ile bu dosyayı kullan.
# Her servise Coolify panelinden domain ata (web, backoffice, api).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportybet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sportybet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportybet}"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sportybet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sportybet}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SPORTSBOOK_API_URL: ${SPORTSBOOK_API_URL:-}
      SPORTSBOOK_API_KEY: ${SPORTSBOOK_API_KEY:-}
    expose:
      - "4000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"

  backoffice:
    build:
      context: ./apps/backoffice
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"

volumes:
  pgdata:
