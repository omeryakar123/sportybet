<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SportyBet Spor</title>
<meta name="description" content="Yeni nesil sportsbook tasarımı — sol spor menüsü, yoğun maç listesi, çalışan kupon. API-Football gerçek verisi."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Saira+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet"/>
<style>
:root{
  --page:#0d0a1c; --panel:#141026; --panel2:#17122c; --row:#161128; --field:#221a3f; --field-h:#2c2250;
  --line:#241c42; --line2:#312552; --fg:#f4f2ff; --muted:#9a8fc0; --dim:#6b6090;
  --violet:#7c5cfc; --magenta:#e23fd0; --acc1:#8b5cf6; --acc2:#e23fd0; --win:#2ee6a0; --loss:#ff5d73; --live:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--fg);font-family:Manrope,system-ui,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased;font-size:14px}
.disp{font-family:"Saira Condensed",Manrope,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.9;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.grad{background:linear-gradient(120deg,var(--acc1),var(--acc2))}
.ribbon{background-image:repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.1) 11px 12px)}
::-webkit-scrollbar{height:6px;width:7px}::-webkit-scrollbar-thumb{background:#2c2250;border-radius:10px}::-webkit-scrollbar-track{background:transparent}
/* top bar (LOGOSUZ) */
header{position:sticky;top:0;z-index:40;background:rgba(13,10,28,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;height:56px;padding:0 16px;max-width:1500px;margin:0 auto}
.burger{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--field);cursor:pointer;font-size:16px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.nav a.on{background:var(--field);color:#fff}.nav a:hover{color:#fff}
.nav a .dot{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live)}
.sp{flex:1}
.bal{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:5px 5px 5px 14px}
.bal .amt{font-weight:800}.bal .amt small{display:block;font-size:10px;color:var(--dim);font-weight:700}
.bal button{border:0;border-radius:8px;padding:9px 15px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;font-size:13px}
.usr{width:38px;height:38px;border-radius:10px;background:var(--field);display:grid;place-items:center;font-size:16px;cursor:pointer}
/* shell 3 col */
.shell{display:grid;grid-template-columns:230px 1fr 320px;gap:14px;max-width:1500px;margin:0 auto;padding:14px 16px 70px}
/* left rail */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;height:max-content;position:sticky;top:70px}
.rail h4{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:12px 10px 6px;font-weight:800}
.rl{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.rl:hover{background:var(--field);color:#fff}.rl.on{background:var(--field);color:#fff}
.rl .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--field)}
.rl.on .ic,.rl:hover .ic{background:linear-gradient(120deg,var(--acc1),var(--acc2))}
.rl .n{margin-left:auto;font-size:11px;color:var(--dim);background:var(--page);padding:1px 8px;border-radius:20px;font-weight:700}
.rl.on .n{color:#fff}
/* center */
.hero{position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(110deg,#241049,#5a1a8c 48%,#b5219c);padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero .glow{position:absolute;right:-30px;top:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,63,208,.5),transparent);filter:blur(10px)}
.hero .rb{position:absolute;left:-50px;top:14px;height:24px;width:250px;transform:rotate(-22deg);background:rgba(226,63,208,.75)}
.hero .l{position:relative}
.hero .tag{display:inline-flex;gap:7px;background:rgba(0,0,0,.25);padding:3px 11px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.hero h1{font-size:40px;margin-top:3px;color:#fff}
.hero p{margin-top:5px;font-size:13px;color:rgba(255,255,255,.82);max-width:360px}
.hero .promo{position:relative;flex-shrink:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 18px;text-align:center}
.hero .promo .big{font-size:26px}.hero .promo .sm{font-size:11px;font-weight:700;opacity:.85;margin-top:2px}
/* sport icon chips */
.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:3px;margin-bottom:14px}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:11px 8px;cursor:pointer}
.chip.on{border-color:var(--violet);background:var(--field)}
.chip .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;font-size:19px;background:var(--field);opacity:.65}
.chip.on .ic{background:linear-gradient(120deg,var(--acc1),var(--acc2));opacity:1;box-shadow:0 5px 16px rgba(124,92,252,.4)}
.chip .t{font-size:11px;font-weight:700;color:var(--dim)}.chip.on .t{color:#fff}
/* popular leagues */
.secrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.secrow h2{font-size:17px}.secrow a{font-size:12px;font-weight:700;color:var(--muted)}
.lgs{display:flex;gap:10px;overflow-x:auto;padding-bottom:3px;margin-bottom:16px}
.lgc{position:relative;overflow:hidden;height:74px;min-width:168px;border-radius:13px;padding:11px;cursor:pointer;border:0;color:#fff;text-align:left}
.lgc.all{background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;min-width:120px;color:var(--muted)}
.lgc .in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.lgc .c{font-size:10px;font-weight:700;opacity:.85}.lgc .nm{font-size:18px}.lgc .mc{font-size:10px;font-weight:700;opacity:.85}
.lgc.sel{outline:2px solid #fff}
/* match table */
.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.lhd{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.lhd .fl{width:22px;height:22px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:12px}
.lhd h3{font-size:14px;font-weight:800}
.lhd .n{margin-left:auto;font-size:11px;color:var(--dim)}
.colhd{display:grid;grid-template-columns:1fr 150px 150px 100px 54px;gap:7px;padding:7px 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);border-bottom:1px solid var(--line)}
.colhd span{text-align:center}.colhd .first{text-align:left}
.m{display:grid;grid-template-columns:1fr 150px 150px 100px 54px;gap:7px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}.m:hover{background:var(--row)}
.minfo{min-width:0}
.mtime{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;color:#c3aefb;margin-bottom:5px}
.mtime .lv{background:var(--live);color:#fff;padding:0 6px;border-radius:4px;font-size:10px}
.tm{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#fff;line-height:1.5}
.tm .lg{width:16px;height:16px;border-radius:50%;object-fit:cover;background:#2c2250;flex-shrink:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.odd{border:0;border-radius:8px;padding:8px 2px;text-align:center;cursor:pointer;background:var(--field);font-family:inherit;transition:.12s;min-width:0}
.odd:hover{background:var(--field-h)}
.odd .l{display:block;font-size:9px;font-weight:800;color:#8d80b8}
.odd .v{display:block;font-size:14px;font-weight:800;color:#fff}
.odd.on{background:linear-gradient(120deg,var(--acc1),var(--acc2));box-shadow:0 4px 14px rgba(124,92,252,.4)}
.odd.on .l{color:rgba(255,255,255,.75)}
.more{display:grid;place-items:center;height:100%;border-radius:8px;background:var(--field);font-size:12px;font-weight:800;color:#c3aefb;cursor:pointer}
.more:hover{background:var(--field-h)}
/* slip */
.slip{position:sticky;top:70px;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--panel);height:max-content}
.shd{display:flex;align-items:center;gap:8px;padding:12px 15px;color:#fff}
.shd .cnt{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:rgba(255,255,255,.25);font-size:12px;font-weight:800}
.shd .ttl{font-size:18px}
.tabs{margin-left:auto;display:flex;gap:3px;background:rgba(0,0,0,.22);padding:2px;border-radius:7px;font-size:12px;font-weight:700}
.tabs button{border:0;background:transparent;color:rgba(255,255,255,.8);padding:5px 11px;border-radius:5px;cursor:pointer;font-family:inherit}
.tabs button.on{background:#fff;color:#2a1250}
.empty{padding:44px 20px;text-align:center;color:#8d80b8;font-size:14px}
.empty .e{margin:0 auto 12px;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--field);font-size:23px}
.si{position:relative;border-bottom:1px solid var(--line);padding:12px 16px}
.si .x{position:absolute;right:12px;top:10px;color:var(--dim);cursor:pointer}.si .x:hover{color:var(--loss)}
.si .mk{font-size:11px;font-weight:700;color:#8d80b8}.si .pk{font-size:14px;font-weight:800;color:#fff}.si .mt{font-size:12px;color:var(--muted)}
.si .od{position:absolute;right:16px;bottom:12px;font-weight:800;color:var(--magenta)}
.foot{padding:16px}
.stake{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--field);border-radius:9px;padding:8px 8px 8px 12px;margin-bottom:10px}
.stake input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-weight:800;font-size:16px;width:100%;font-family:inherit}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.quick button{border:0;background:var(--field);color:var(--muted);font-weight:700;font-size:12px;padding:7px 0;border-radius:7px;cursor:pointer;font-family:inherit}
.quick button:hover{background:var(--field-h);color:#fff}
.ln{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;color:var(--muted)}.ln b{color:#fff}
.ln.big{border-top:1px solid var(--line);padding-top:9px;margin-top:5px}.ln.big b{color:var(--win);font-size:18px}
.play{width:100%;border:0;border-radius:11px;padding:14px;font-family:"Saira Condensed",sans-serif;font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 6px 20px rgba(124,92,252,.45)}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);padding:13px 24px;border-radius:12px;font-family:"Saira Condensed",sans-serif;font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;color:#fff;opacity:0;transition:.3s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:1180px){.shell{grid-template-columns:1fr 300px}.rail{display:none}}
@media(max-width:920px){.shell{grid-template-columns:1fr}.slip{position:fixed;inset:auto 8px 8px;z-index:40;max-height:72vh;overflow:auto}.nav{display:none}.colhd{display:none}.m{grid-template-columns:1fr;gap:9px}.hero h1{font-size:30px}.hero .promo{display:none}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="burger">☰</div>
  <nav class="nav"><a class="on">⚽ Spor</a><a><span class="dot"></span>Canlı</a><a>🎰 Casino</a><a>🔮 Tahminler</a><a>🎁 Promosyonlar</a></nav>
  <div class="sp"></div>
  <div class="bal"><span class="amt">₺2.500,00<small>Ana Para</small></span><button class="grad" onclick="alert('Para Yatır')">Para Yatır</button></div>
  <div class="usr">👤</div>
</div></header>

<div class="shell">
  <!-- SOL RAIL -->
  <aside class="rail">
    <h4>Spor Dalları</h4>
    <div id="sports"></div>
    <h4>Popüler Ligler</h4>
    <div id="raillgs"></div>
  </aside>

  <!-- ORTA -->
  <main>
    <section class="hero">
      <div class="glow"></div><div class="rb ribbon"></div>
      <div class="l">
        <span class="tag">● Canlı & Maç Öncesi</span>
        <h1 class="disp">Spor Bahisleri</h1>
        <p>Binlerce karşılaşma, yüksek oranlar. Kazancın maç biter bitmez cüzdanında.</p>
      </div>
      <div class="promo"><div class="disp big">%100</div><div class="sm">İLK BAHİS BONUSU</div></div>
    </section>

    <div class="chips" id="chips"></div>

    <div class="secrow"><h2 class="disp">Popüler Ligler</h2><a>Tümü →</a></div>
    <div class="lgs" id="lgs"></div>

    <div class="secrow"><h2 class="disp">Günün Maçları</h2><a id="daytxt"></a></div>
    <div id="matches"></div>
  </main>

  <!-- KUPON -->
  <aside><div class="slip"><div id="slip"></div></div></aside>
</div>
<div class="toast grad" id="toast">Kupon oynandı! 🎉</div>

<script>
const SPORTS=[["⚽","Futbol",128,1],["🏀","Basketbol",46],["🎾","Tenis",31],["🏐","Voleybol",12],["🏒","Buz Hokeyi",18],["🤾","Hentbol",7],["🎮","E-Spor",24],["🏈","Amerikan F.",9],["⚾","Beyzbol",5],["🥊","MMA / Boks",4]];
const GRADS=["linear-gradient(135deg,#7c3aed,#e23fd0)","linear-gradient(135deg,#2563eb,#06b6d4)","linear-gradient(135deg,#db2777,#f59e0b)","linear-gradient(135deg,#16a34a,#4ade80)","linear-gradient(135deg,#e11d48,#f97316)","linear-gradient(135deg,#6366f1,#e23fd0)"];
const DATA=[
 {lg:"Süper Lig",ct:"Türkiye",t:"20:00",h:"Alanyaspor",a:"Kocaelispor",o:{h:1.95,d:3.10,a:3.90,by:1.95,bn:1.75}},
 {lg:"Bundesliga",ct:"Almanya",t:"21:30",h:"VfB Stuttgart",a:"B. Mönchengladbach",o:{h:1.36,d:5.00,a:6.50,by:1.44,bn:2.70}},
 {lg:"Serie A",ct:"İtalya",t:"21:45",h:"Torino",a:"Monza",o:{h:2.10,d:3.30,a:3.30,by:1.73,bn:2.05}},
 {lg:"Ligue 1",ct:"Fransa",t:"21:45",h:"Stade Brestois",a:"Nice",o:{h:2.20,d:3.25,a:3.10,by:1.57,bn:2.40}},
 {lg:"Premier League",ct:"İngiltere",t:"22:00",h:"Ipswich",a:"Nottingham Forest",o:{h:3.10,d:3.30,a:2.20,by:1.57,bn:2.30}},
 {lg:"La Liga",ct:"İspanya",t:"22:00",h:"Alaves",a:"Malaga",o:{h:1.70,d:3.50,a:5.00,by:1.91,bn:1.83}},
];
const TRY=n=>"₺"+n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
let picks=[],mode="combo",filter=null,bal=2500;
const leagues=[...new Set(DATA.map(d=>d.lg))];

document.getElementById("daytxt").textContent=new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
// sol rail spor dalları
document.getElementById("sports").innerHTML=SPORTS.map(([ic,nm,n,on])=>`<div class="rl ${on?"on":""}"><span class="ic">${ic}</span>${nm}<span class="n">${n}</span></div>`).join("");
// sol rail ligler
function drawRailLgs(){document.getElementById("raillgs").innerHTML=`<div class="rl ${filter===null?"on":""}" onclick="setF(null)"><span class="ic">🌐</span>Tüm Maçlar<span class="n">${DATA.length}</span></div>`+leagues.map(lg=>{const c=DATA.filter(d=>d.lg===lg).length;return `<div class="rl ${filter===lg?"on":""}" onclick="setF('${lg}')"><span class="ic">🏆</span>${lg}<span class="n">${c}</span></div>`}).join("");}
// çipler
document.getElementById("chips").innerHTML=SPORTS.slice(0,8).map(([ic,nm,n,on])=>`<div class="chip ${on?"on":""}"><span class="ic">${ic}</span><span class="t">${nm}</span></div>`).join("");
// popüler lig kartları
function drawLgs(){document.getElementById("lgs").innerHTML=`<button class="lgc all disp ${filter===null?"sel":""}" onclick="setF(null)">Tümü</button>`+leagues.map((lg,i)=>{const ct=DATA.find(d=>d.lg===lg).ct;const c=DATA.filter(d=>d.lg===lg).length;return `<button class="lgc ${filter===lg?"sel":""}" style="background:${GRADS[i%GRADS.length]}" onclick="setF('${lg}')"><div class="ribbon" style="position:absolute;inset:0;opacity:.18"></div><div class="in"><span class="c">${ct}</span><div><div class="nm disp">${lg}</div><div class="mc">${c} maç</div></div></div></button>`}).join("");}
window.setF=f=>{filter=f;drawRailLgs();drawLgs();drawMatches();};

function drawMatches(){
  const groups={};DATA.filter(d=>!filter||d.lg===filter).forEach(d=>{(groups[d.lg] ||= []).push(d)});
  let html="";
  for(const [lg,evs] of Object.entries(groups)){
    html+=`<div class="block"><div class="lhd"><span class="fl">🏆</span><h3>${lg}</h3><span class="n">${evs.length} maç</span></div>
      <div class="colhd"><span class="first">Maç</span><span>Maç Sonucu 1X2</span><span>Karşılıklı Gol</span><span>Çifte Şans</span><span>+</span></div>`;
    evs.forEach(ev=>{const i=DATA.indexOf(ev);
      html+=`<div class="m">
        <div class="minfo"><span class="mtime">🕑 Bugün ${ev.t}</span><div class="tm"><span class="lg"></span>${ev.h}</div><div class="tm"><span class="lg"></span>${ev.a}</div></div>
        <div class="g3">${od(i,"MS","1",ev.h+" kazanır",ev.o.h)}${od(i,"MS","X","Beraberlik",ev.o.d)}${od(i,"MS","2",ev.a+" kazanır",ev.o.a)}</div>
        <div class="g2">${od(i,"KG","Var","KG Var",ev.o.by)}${od(i,"KG","Yok","KG Yok",ev.o.bn)}</div>
        <div class="g2">${od(i,"CS","1X","1 veya X",+(1/((1/ev.o.h)+(1/ev.o.d))*0.92).toFixed(2))}${od(i,"CS","12","1 veya 2",+(1/((1/ev.o.h)+(1/ev.o.a))*0.92).toFixed(2))}</div>
        <div class="more" title="Tüm marketler">+42</div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById("matches").innerHTML=html;
}
function od(i,mkt,lab,pick,val){const id=i+"_"+mkt+"_"+lab;const on=picks.some(p=>p.id===id);return `<button class="odd ${on?"on":""}" onclick="pick(${i},'${mkt}','${lab}','${(pick+'').replace(/'/g,'')}',${val},'${id}')"><span class="l">${lab}</span><span class="v">${(+val).toFixed(2)}</span></button>`;}
const MKT={MS:"Maç Sonucu",KG:"Karşılıklı Gol",CS:"Çifte Şans"};
window.pick=(i,mkt,lab,pk,val,id)=>{const ex=picks.findIndex(p=>p.id===id);if(ex>-1)picks.splice(ex,1);else{picks=picks.filter(p=>!(p.evi===i&&p.mkt===mkt));picks.push({id,evi:i,mktk:mkt,match:DATA[i].h+" - "+DATA[i].a,mkt:MKT[mkt],pick:pk,val:+val});}drawMatches();drawSlip();};
function drawSlip(){
  const el=document.getElementById("slip");
  const head=`<div class="shd grad"><span class="cnt">${picks.length}</span><span class="ttl disp">Kupon</span><div class="tabs"><button class="${mode==="combo"?"on":""}" onclick="setMode('combo')">Kombine</button><button class="${mode==="single"?"on":""}" onclick="setMode('single')">Tekli</button></div></div>`;
  if(!picks.length){el.innerHTML=head+`<div class="empty"><div class="e">🎟️</div>Kuponun boş.<br>Oynamak için bir orana dokun.</div>`;return;}
  const tot=picks.reduce((a,p)=>a*p.val,1);
  const stake=parseFloat((document.getElementById("stk")?.value||"100").replace(",","."))||0;
  const win=mode==="combo"?stake*tot:picks.reduce((a,p)=>a+stake*p.val,0);
  const cost=mode==="combo"?stake:stake*picks.length;
  el.innerHTML=head+`<div>${picks.map(p=>`<div class="si"><span class="x" onclick="rm('${p.id}')">✕</span><div class="mk">${p.mkt}</div><div class="pk">${p.pick}</div><div class="mt">${p.match}</div><div class="od">${p.val.toFixed(2)}</div></div>`).join("")}</div>
   <div class="foot">
     <div class="stake"><input id="stk" value="${stake}" oninput="drawSlip()"><span style="color:var(--muted);font-weight:800;padding-right:6px">₺</span></div>
     <div class="quick">${[50,100,250,500].map(v=>`<button onclick="setStk(${v})">${v}</button>`).join("")}</div>
     ${mode==="combo"?`<div class="ln">Toplam Oran<b>${tot.toFixed(2)}</b></div>`:""}
     <div class="ln big">Olası Kazanç<b>${TRY(win)}</b></div>
     <button class="play grad" onclick="play(${cost})">Kuponu Oyna · ${TRY(cost)}</button>
     <div class="note">Maç bitince kupon otomatik sonuçlanır.</div>
   </div>`;
}
window.setMode=m=>{mode=m;drawSlip();};
window.rm=id=>{picks=picks.filter(p=>p.id!==id);drawMatches();drawSlip();};
window.setStk=v=>{const i=document.getElementById("stk");if(i){i.value=v;drawSlip();}};
window.play=cost=>{if(cost>bal){alert("Yetersiz bakiye");return;}bal-=cost;document.querySelector(".bal .amt").innerHTML=TRY(bal)+"<small>Ana Para</small>";const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300);picks=[];drawMatches();drawSlip();};
drawRailLgs();drawLgs();drawMatches();drawSlip();
</script>
</body>
</html>
