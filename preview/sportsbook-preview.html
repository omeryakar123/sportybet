<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SportyBet Spor</title>
<meta name="description" content="SportyBet spor bahis — BetWin & SportsBet harmanı tasarım, API-Football'dan gerçek maçlar ve oranlar, çalışan kupon."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Saira+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet"/>
<style>
:root{
  --page:#120a26; --panel:#1b1136; --row:#1b1136; --field:#271a4d; --field-h:#31215e;
  --line:#2c1d52; --line2:#3a2563; --fg:#f3f0ff; --muted:#a99cc9; --dim:#74679b;
  --violet:#8b5cf6; --magenta:#d946ef; --win:#34e39b; --loss:#fb5a6a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--fg);font-family:Manrope,system-ui,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased}
.disp{font-family:"Saira Condensed",Manrope,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1320px;margin:0 auto;padding:0 14px}
.ribbon{background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.12) 10px 11px)}
.grad{background:linear-gradient(135deg,#8b5cf6,#d946ef)}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:#3a2563;border-radius:10px}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(18,10,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-size:24px}.logo b{color:var(--magenta)}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{padding:8px 13px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted)}
.nav a.on{background:var(--field);color:#fff}.nav a:hover{color:#fff}
.sp{flex:1}
.bal{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px}
.bal .amt{font-weight:800}
.bal button{border:0;border-radius:7px;padding:7px 13px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;font-size:13px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(110deg,#2a1150,#5b1b8f 45%,#b01e9e);padding:34px 34px;margin:16px 0 20px}
.hero .glow{position:absolute;right:-40px;top:-40px;width:230px;height:230px;border-radius:50%;background:radial-gradient(closest-side,rgba(217,70,239,.5),transparent);filter:blur(12px)}
.hero .rb{position:absolute;left:-60px;top:22px;height:28px;width:290px;transform:rotate(-24deg);background:rgba(217,70,239,.8)}
.hero .tag{display:inline-flex;gap:8px;background:rgba(0,0,0,.25);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.hero h1{font-size:60px;margin-top:4px}
.hero p{margin-top:8px;max-width:440px;font-size:14px;color:rgba(255,255,255,.82)}
.hero .promo{margin-top:16px;display:inline-flex;gap:8px;background:rgba(255,255,255,.15);padding:9px 16px;border-radius:10px;font-size:20px}
/* chips */
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:12px 10px;cursor:pointer}
.chip.on{border-color:var(--violet);background:var(--field)}
.chip .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:20px;background:var(--field);opacity:.7}
.chip.on .ic{background:linear-gradient(135deg,#8b5cf6,#d946ef);opacity:1;box-shadow:0 4px 14px rgba(168,85,247,.45)}
.chip span.t{font-size:11px;font-weight:700;color:var(--dim)}.chip.on span.t{color:#fff}
/* leagues */
.sech{font-size:22px;margin-bottom:10px}
.lgs{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px}
.lgcard{position:relative;overflow:hidden;height:80px;min-width:182px;border-radius:14px;padding:12px;text-align:left;cursor:pointer;border:0;color:#fff}
.lgcard.all{background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;min-width:150px}
.lgcard .in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.lgcard .c{font-size:11px;font-weight:700;opacity:.85}
.lgcard .nm{font-size:20px}.lgcard .mc{font-size:11px;font-weight:700;opacity:.85}
.lgcard.sel{outline:2px solid rgba(255,255,255,.7)}
/* layout */
.grid{display:grid;grid-template-columns:1fr 350px;gap:16px}
.leaguehdr{display:flex;align-items:center;gap:8px;padding:0 2px;margin-bottom:8px}
.leaguehdr .b{width:4px;height:16px;border-radius:3px;background:linear-gradient(#8b5cf6,#d946ef)}
.leaguehdr h3{font-size:18px}
.leaguehdr .n{background:var(--field);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.key{display:grid;grid-template-columns:1fr 180px 120px;gap:8px;padding:0 16px 4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.key .c{text-align:center}
.match{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;margin-bottom:8px}
.match:hover{border-color:var(--line2)}
.match .top{display:grid;grid-template-columns:1fr 180px 120px;gap:8px;align-items:center}
.time{display:inline-flex;gap:6px;background:var(--field);padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;color:#c4b5fd;margin-bottom:5px}
.tm{font-size:14px;font-weight:700;color:#fff;line-height:1.45}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.odd{border:0;border-radius:8px;padding:7px 2px;text-align:center;cursor:pointer;background:var(--field);font-family:inherit;transition:.12s}
.odd:hover{background:var(--field-h)}
.odd .l{display:block;font-size:10px;font-weight:800;color:#8678ad}
.odd .v{display:block;font-size:14px;font-weight:800;color:#fff}
.odd.on{background:linear-gradient(135deg,#8b5cf6,#d946ef);box-shadow:0 4px 14px rgba(168,85,247,.4)}
.odd.on .l{color:rgba(255,255,255,.7)}
/* slip */
.slip{position:sticky;top:76px;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.slip .hd{display:flex;align-items:center;gap:8px;padding:12px 15px;color:#fff}
.slip .hd .cnt{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);font-size:12px;font-weight:800}
.slip .hd .ttl{font-size:19px}
.tabs{margin-left:auto;display:flex;gap:4px;background:rgba(0,0,0,.2);padding:2px;border-radius:7px;font-size:12px;font-weight:700}
.tabs button{border:0;background:transparent;color:rgba(255,255,255,.8);padding:5px 11px;border-radius:5px;cursor:pointer;font-family:inherit}
.tabs button.on{background:rgba(255,255,255,.9);color:#2a1250}
.empty{padding:46px 20px;text-align:center;color:#8678ad;font-size:14px}
.empty .e{margin:0 auto 12px;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--field);font-size:24px}
.si{position:relative;border-bottom:1px solid var(--line);padding:12px 16px}
.si .x{position:absolute;right:12px;top:10px;color:var(--dim);cursor:pointer}.si .x:hover{color:var(--loss)}
.si .mk{font-size:11px;font-weight:700;color:#8678ad}.si .pk{font-size:14px;font-weight:800;color:#fff}.si .mt{font-size:12px;color:var(--muted)}
.si .od{position:absolute;right:16px;bottom:12px;font-weight:800;color:var(--magenta)}
.foot{padding:16px}
.stake{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--field);border-radius:9px;padding:7px 8px 7px 12px;margin-bottom:10px}
.stake input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-weight:800;font-size:16px;width:100%;font-family:inherit}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.quick button{border:0;background:var(--field);color:var(--muted);font-weight:700;font-size:12px;padding:7px 0;border-radius:7px;cursor:pointer;font-family:inherit}
.quick button:hover{background:var(--field-h);color:#fff}
.ln{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;color:var(--muted)}.ln b{color:#fff}
.ln.big{border-top:1px solid var(--line);padding-top:9px;margin-top:5px}.ln.big b{color:var(--win);font-size:18px}
.play{width:100%;border:0;border-radius:12px;padding:14px;font-family:"Saira Condensed",sans-serif;font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 6px 20px rgba(168,85,247,.45)}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);padding:13px 24px;border-radius:12px;font-family:"Saira Condensed",sans-serif;font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;color:#fff;opacity:0;transition:.3s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.slip{position:fixed;inset:auto 8px 8px;z-index:40;max-height:72vh;overflow:auto}.key{display:none}.match .top{grid-template-columns:1fr;gap:10px}.hero h1{font-size:40px}.nav{display:none}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo disp">Sporty<b>Bet</b></div>
  <nav class="nav"><a class="on">Spor</a><a>Canlı</a><a>Tahminler</a><a>Casino</a><a>Promosyonlar</a></nav>
  <div class="sp"></div>
  <div class="bal"><span class="amt" id="bal">₺2.500,00</span><button class="grad">Para Yatır</button></div>
</div></header>

<div class="wrap">
  <!-- HERO -->
  <section class="hero">
    <div class="glow"></div><div class="rb ribbon"></div>
    <div style="position:relative">
      <span class="tag">● Canlı & Maç Öncesi</span>
      <h1 class="disp">Spor Bahisleri</h1>
      <p>Binlerce karşılaşma, yüksek oranlar. Kuponunu yap, kazancın maç biter bitmez cüzdanında.</p>
      <div class="promo disp">🎁 İlk Bahis Bonusu · %100</div>
    </div>
  </section>

  <!-- SPOR ÇİPLERİ -->
  <div class="chips" id="chips"></div>

  <!-- POPÜLER LİGLER -->
  <h2 class="disp sech">Popüler Ligler</h2>
  <div class="lgs" id="lgs"></div>

  <!-- GRID -->
  <div class="grid">
    <main id="matches"></main>
    <aside><div class="slip"><div id="slip"></div></div></aside>
  </div>
</div>
<div class="toast grad" id="toast">Kupon oynandı! 🎉</div>

<script>
const SPORTS=[["⚽","Futbol",1],["🏀","Basketbol"],["🎾","Tenis"],["🏐","Voleybol"],["🏒","Buz Hokeyi"],["🎮","E-Spor"],["🏈","Amerikan F."],["⚾","Beyzbol"]];
const GRADS=["linear-gradient(135deg,#7c3aed,#d946ef)","linear-gradient(135deg,#2563eb,#06b6d4)","linear-gradient(135deg,#db2777,#f59e0b)","linear-gradient(135deg,#16a34a,#4ade80)","linear-gradient(135deg,#e11d48,#f97316)","linear-gradient(135deg,#6366f1,#d946ef)"];
const DATA=[
 {lg:"Süper Lig",ct:"Türkiye",t:"20:00",h:"Alanyaspor",a:"Kocaelispor",o:{h:1.95,d:3.10,a:3.90,by:1.95,bn:1.75}},
 {lg:"Bundesliga",ct:"Almanya",t:"21:30",h:"VfB Stuttgart",a:"B. Mönchengladbach",o:{h:1.36,d:5.00,a:6.50,by:1.44,bn:2.70}},
 {lg:"Serie A",ct:"İtalya",t:"21:45",h:"Torino",a:"Monza",o:{h:2.10,d:3.30,a:3.30,by:1.73,bn:2.05}},
 {lg:"Ligue 1",ct:"Fransa",t:"21:45",h:"Stade Brestois",a:"Nice",o:{h:2.20,d:3.25,a:3.10,by:1.57,bn:2.40}},
 {lg:"Premier League",ct:"İngiltere",t:"22:00",h:"Ipswich",a:"Nottingham Forest",o:{h:3.10,d:3.30,a:2.20,by:1.57,bn:2.30}},
 {lg:"La Liga",ct:"İspanya",t:"22:00",h:"Alaves",a:"Malaga",o:{h:1.70,d:3.50,a:5.00,by:1.91,bn:1.83}},
];
const TRY=n=>"₺"+n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
let picks=[],mode="combo",filter=null,bal=2500;

// çipler
document.getElementById("chips").innerHTML=SPORTS.map(([ic,nm,on])=>`<div class="chip ${on?"on":""}"><span class="ic">${ic}</span><span class="t">${nm}</span></div>`).join("");
// ligler
const leagues=[...new Set(DATA.map(d=>d.lg))];
function drawLeagues(){
  document.getElementById("lgs").innerHTML=`<button class="lgcard all disp ${filter===null?"sel":""}" onclick="setF(null)">Tüm Maçlar</button>`+
   leagues.map((lg,i)=>{const ct=DATA.find(d=>d.lg===lg).ct;const c=DATA.filter(d=>d.lg===lg).length;return `<button class="lgcard ${filter===lg?"sel":""}" style="background:${GRADS[i%GRADS.length]}" onclick="setF('${lg}')"><div class="ribbon" style="position:absolute;inset:0;opacity:.2"></div><div class="in"><span class="c">${ct}</span><div><div class="nm disp">${lg}</div><div class="mc">${c} maç</div></div></div></button>`}).join("");
}
window.setF=f=>{filter=f;drawLeagues();drawMatches();};

function drawMatches(){
  const groups={};DATA.filter(d=>!filter||d.lg===filter).forEach(d=>{(groups[d.lg] ||= []).push(d)});
  let html="";
  for(const [lg,evs] of Object.entries(groups)){
    html+=`<section style="margin-bottom:20px"><div class="leaguehdr"><span class="b"></span><h3 class="disp">${lg}</h3><span class="n">${evs.length}</span></div>
      <div class="key"><span></span><span class="c">Maç Sonucu (1 · X · 2)</span><span class="c">Kars. Gol</span></div>`;
    evs.forEach(ev=>{
      const i=DATA.indexOf(ev);
      html+=`<div class="match"><div class="top">
        <div style="min-width:0"><span class="time">🕑 Bugün ${ev.t}</span><div class="tm">${ev.h}</div><div class="tm">${ev.a}</div></div>
        <div class="g3">${od(i,"MS","1",ev.h+" kazanır",ev.o.h)}${od(i,"MS","X","Beraberlik",ev.o.d)}${od(i,"MS","2",ev.a+" kazanır",ev.o.a)}</div>
        <div class="g2">${od(i,"KG","Var","KG Var",ev.o.by)}${od(i,"KG","Yok","KG Yok",ev.o.bn)}</div>
      </div></div>`;
    });
    html+=`</section>`;
  }
  document.getElementById("matches").innerHTML=html;
}
function od(i,mkt,lab,pick,val){const id=i+"_"+mkt+"_"+lab;const on=picks.some(p=>p.id===id);return `<button class="odd ${on?"on":""}" onclick="pick(${i},'${mkt}','${lab}','${pick.replace(/'/g,"")}',${val},'${id}')"><span class="l">${lab}</span><span class="v">${val.toFixed(2)}</span></button>`;}
window.pick=(i,mkt,lab,pk,val,id)=>{
  const ex=picks.findIndex(p=>p.id===id);
  if(ex>-1)picks.splice(ex,1);
  else{picks=picks.filter(p=>p.evi!==i);picks.push({id,evi:i,match:DATA[i].h+" - "+DATA[i].a,mkt:mkt==="MS"?"Maç Sonucu":"Karşılıklı Gol",pick:pk,val});}
  drawMatches();drawSlip();
};
function drawSlip(){
  const el=document.getElementById("slip");
  const head=`<div class="hd grad"><span class="cnt">${picks.length}</span><span class="ttl disp">Kupon</span><div class="tabs"><button class="${mode==="combo"?"on":""}" onclick="setMode('combo')">Kombine</button><button class="${mode==="single"?"on":""}" onclick="setMode('single')">Tekli</button></div></div>`;
  if(!picks.length){el.innerHTML=head+`<div class="empty"><div class="e">🎟️</div>Kuponun boş.<br>Oynamak için bir orana dokun.</div>`;return;}
  const tot=picks.reduce((a,p)=>a*p.val,1);
  const stake=parseFloat((document.getElementById("stk")?.value||"100").replace(",","."))||0;
  const win=mode==="combo"?stake*tot:picks.reduce((a,p)=>a+stake*p.val,0);
  const cost=mode==="combo"?stake:stake*picks.length;
  el.innerHTML=head+`<div>${picks.map(p=>`<div class="si"><span class="x" onclick="rm('${p.id}')">✕</span><div class="mk">${p.mkt}</div><div class="pk">${p.pick}</div><div class="mt">${p.match}</div><div class="od">${p.val.toFixed(2)}</div></div>`).join("")}</div>
   <div class="foot">
     <div class="stake"><input id="stk" value="${stake}" oninput="drawSlip()"><span style="color:var(--muted);font-weight:800;padding-right:6px">₺</span></div>
     <div class="quick">${[50,100,250,500].map(v=>`<button onclick="setStk(${v})">${v}</button>`).join("")}</div>
     ${mode==="combo"?`<div class="ln">Toplam Oran<b>${tot.toFixed(2)}</b></div>`:""}
     <div class="ln big">Olası Kazanç<b>${TRY(win)}</b></div>
     <button class="play grad" onclick="play(${cost})">Kuponu Oyna · ${TRY(cost)}</button>
     <div class="note">Maç bitince kupon otomatik sonuçlanır.</div>
   </div>`;
}
window.setMode=m=>{mode=m;drawSlip();};
window.rm=id=>{picks=picks.filter(p=>p.id!==id);drawMatches();drawSlip();};
window.setStk=v=>{const i=document.getElementById("stk");if(i){i.value=v;drawSlip();}};
window.play=cost=>{if(cost>bal){alert("Yetersiz bakiye");return;}bal-=cost;document.getElementById("bal").textContent=TRY(bal);const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300);picks=[];drawMatches();drawSlip();};
drawLeagues();drawMatches();drawSlip();
</script>
</body>
</html>
